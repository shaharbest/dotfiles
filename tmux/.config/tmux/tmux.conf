# --- General ---
set -g prefix C-s
set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g focus-events on
set -g default-terminal 'screen-256color'
set -ag terminal-overrides ',xterm-256color:RGB'

# --- Keybindings ---
bind r source-file ~/.config/tmux/tmux.conf
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Status Bar ---
set -g status-position top

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'

# --- Catppuccin Theme ---
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

# --- Copy Mode (vim keys) --- BEGIN ---
# Use vi bindings inside copy mode (scroll/select buffer)
setw -g mode-keys vi
# 'v' starts a character-wise selection (like visual mode in vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection
# 'y' yanks the selection to the system clipboard and exits copy mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Releasing a mouse drag copies the selection to the system clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
#
# HOW TO USE:
#   Enter copy mode  : C-s [
#   Exit copy mode   : q  or  Escape
#   Scroll           : k/j (line)   C-u/C-d (half page)
#   Search           : / (forward)  ? (backward)   n/N (next/prev)
#   Select           : v (char)   V (line)   C-v (block)
#   Copy to clipboard: y  (exits copy mode automatically)
#   Mouse            : trackpad scroll enters copy mode;
#                      click-drag a selection and release to copy
# --- Copy Mode (vim keys) --- END ---

# --- TPM Bootstrap (keep at bottom) ---
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/tpm'"
run '~/.config/tmux/plugins/tpm/tpm'
